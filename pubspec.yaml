name: flutter_fast_template
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # firebase - ⚠️ update ios/Podfile l35 when updating firebase packages
  firebase_core: "3.11.0"
  firebase_analytics: "11.4.2"
  firebase_crashlytics: "4.3.2"
  firebase_remote_config: "5.4.0"
  firebase_auth: "5.4.2"
  cloud_firestore: "5.6.3"
  # firebase_messaging: "15.2.2"

  # i18n
  easy_localization: ^3.0.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - env/
    - assets/
    - assets/images/
    - assets/videos/
    - assets/translations/
    - assets/fonts/
    - assets/tuto/
    - assets/onboarding/
