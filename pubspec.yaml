name: weeksalive
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # firebase - ⚠️ update ios/Podfile l35 when updating firebase packages
  firebase_core: "4.2.1"
  firebase_analytics: "12.0.4"
  firebase_crashlytics: "5.0.5"
  firebase_remote_config: "6.1.2"

  # redux
  redux: "5.0.0"
  flutter_redux: "0.10.0"

  # RevenueCat
  purchases_flutter: ^9.6.1

  # i18n
  easy_localization: ^3.0.7+1
  jiffy: ^6.3.2

  # app
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  logger: ^2.5.0
  freezed_annotation: ^2.4.4
  flutter_timezone: ^4.1.0
  package_info_plus: ^8.3.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  carousel_slider: ^5.0.0
  ming_cute_icons: ^0.0.7
  quick_actions: ^1.1.0
  uuid: ^4.5.3
  async: ^2.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4+4
  flutter_lints: ^4.0.0

  # file generation
  flutter_launcher_icons: "0.13.1"
  flutter_native_splash: "2.4.0"

  # code generation
  freezed: ^2.5.7
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - env/
    - assets/
    - assets/images/
    - assets/videos/
    - assets/translations/
    - assets/fonts/
    - assets/tuto/
    - assets/onboarding/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
