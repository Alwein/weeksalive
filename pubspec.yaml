name: weeksalive
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # firebase - ⚠️ update ios/Podfile l35 when updating firebase packages
  firebase_core: "4.2.1"
  firebase_analytics: "12.0.4"
  firebase_crashlytics: "5.0.5"
  firebase_remote_config: "6.1.2"

  # redux
  redux: "5.0.0"
  flutter_redux: "0.10.0"

  # RevenueCat
  purchases_flutter: ^9.6.1

  # i18n
  easy_localization: ^3.0.7+1
  jiffy: ^6.3.2

  # app
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  logger: ^2.5.0
  freezed_annotation: ^3.0.0
  flutter_timezone: ^4.1.0
  package_info_plus: ^8.3.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  carousel_slider: ^5.0.0
  ming_cute_icons: ^0.0.8
  quick_actions: ^1.1.0
  uuid: ^4.5.3
  async: ^2.13.1
  rive: ^0.14.6
  sensors_plus: ^6.1.1
  flutter_staggered_animations: ^1.1.1
  rive_native: ^0.1.6
  flutter_advanced_haptic: ^1.0.1
  intl: ^0.20.2
  flutter_local_notifications: ^20.1.0
  app_tracking_transparency: ^2.0.6
  hidden_logo: ^1.1.0
  timezone: ^0.10.1
  in_app_review: ^2.0.12
  collection: ^1.19.1
  image_picker: ^1.2.2
  flutter_svg: ^2.3.0
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path_provider_foundation: ^2.4.0
  path: ^1.9.1
  smooth_sheets: ^1.0.2
  flutter_image_compress: ^2.4.0
  app_settings: ^7.0.0
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4+4
  flutter_lints: ^4.0.0

  # file generation
  flutter_launcher_icons: "0.13.1"
  flutter_native_splash: "2.4.0"

  # code generation
  freezed: ^3.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - env/
    - assets/
    - assets/images/
    - assets/animations/
    - assets/videos/
    - assets/translations/
    - assets/fonts/
    - assets/tuto/
    - assets/onboarding/

  fonts:
    - family: ShadowsIntoLight
      fonts:
        - asset: assets/fonts/ShadowsIntoLight-Regular.ttf
          weight: 400
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
